[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "enterprise-network-security-automation"
version = "1.0.0"
description = "Offline network security configuration drift and approval-gated remediation simulation"
requires-python = ">=3.10"
[project.scripts]
netguard = "netguard.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
